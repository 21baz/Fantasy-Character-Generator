<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Forge: Alchemist's Workbench</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;700&family=MedievalSharp&family=Special+Elite&display=swap');
        
        :root {
            --gold: #d4af37;
            --bronze: #cd7f32;
            --aged-parchment: #e2d1b0;
        }

        body {
            font-family: 'MedievalSharp', cursive;
            background-color: #0c0a09;
            color: #d1d5db;
            /* Wood texture overlay */
            background-image: 
                linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)),
                url("https://www.transparenttextures.com/patterns/dark-wood.png");
            overflow-x: hidden;
        }

        h1, h2, h3, .fantasy-font {
            font-family: 'Cinzel Decorative', serif;
        }

        .handwritten {
            font-family: 'Special Elite', cursive;
            line-height: 1.6;
        }

        .parchment-sheet {
            background-color: var(--aged-parchment);
            background-image: url("https://www.transparenttextures.com/patterns/pulp.png");
            box-shadow: 
                0 0 0 1px rgba(0,0,0,0.2),
                0 10px 30px -5px rgba(0,0,0,0.8),
                inset 0 0 60px rgba(139, 94, 60, 0.3);
            border-radius: 4px;
            position: relative;
        }

        /* Irregular edges simulation */
        .parchment-sheet::before {
            content: "";
            position: absolute;
            inset: -2px;
            z-index: -1;
            background: #8b5e3c;
            filter: blur(2px);
            opacity: 0.5;
        }

        .alchemist-glow {
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .rune-float {
            animation: rune-float 6s ease-in-out infinite;
        }

        @keyframes rune-float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
            50% { transform: translateY(-20px) rotate(5deg); opacity: 0.4; }
        }

        /* Transmutation Circle Loader */
        .transmutation-circle {
            width: 120px;
            height: 120px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            position: relative;
            animation: spin 10s linear infinite;
        }
        .transmutation-circle::after {
            content: "";
            position: absolute;
            top: 10%; left: 10%; right: 10%; bottom: 10%;
            border: 1px solid var(--gold);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
